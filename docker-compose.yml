services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      retries: 5

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  servicio-python:
    build: ./servicio-python
    env_file: .env
    ports: 
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend

  servicio-node:
    build: ./servicio-node
    env_file: .env
    ports: 
      - "3000:3000"
    depends_on:
      - mongodb
    networks:
      - backend
      - frontend

  servicio-go:
    build: ./servicio-go
    env_file: .env
    ports:
      - "8004:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - frontend
      
volumes:
  postgres_data:
  mongo_data:

networks:
  backend:
  frontend: