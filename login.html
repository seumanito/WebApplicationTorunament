<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Torneos - Iniciar Sesion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <h2>Iniciar Sesion</h2>
            <p class="login-subtitle">Ingresa tus credenciales para acceder</p>
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej: admin">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ej: admin123">
            </div>

            <button type="button" class="btn-primary btn-block" onclick="doLogin()">Ingresar</button>
            <p id="error-msg" class="error-msg"></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
